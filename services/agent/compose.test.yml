name: zaowu-agent-stage2-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zaowu_agent_test
      POSTGRES_PASSWORD: agent_test
      POSTGRES_USER: agent
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d zaowu_agent_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
