[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zaowu-agent-service"
version = "0.2.0"
description = "Durable Agent orchestration service for Zaowu Engineering Workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2026.7,<2027",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "langsmith>=0.13,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zaowu_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=zaowu_agent --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
    "integration: requires the disposable PostgreSQL test container",
]

[tool.coverage.run]
branch = true
source = ["zaowu_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
