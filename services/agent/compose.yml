name: zaowu-agent-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zaowu_agent
      POSTGRES_PASSWORD: agent_local
      POSTGRES_USER: agent
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d zaowu_agent"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agent_postgres_data:/var/lib/postgresql/data

volumes:
  agent_postgres_data:
